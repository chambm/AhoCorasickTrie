# Runs R CMD check --as-cran on the platforms CRAN cares most about, plus a
# sanitizer build (CRAN runs ASAN/UBSAN checks after acceptance and has flagged
# this package before). Also called by cran-release.yaml as its gate.
name: R-CMD-check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Defaults to args = c("--no-manual", "--as-cran") and fails on WARNING or ERROR.
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  sanitizers:
    name: ASAN/UBSAN (R-devel)
    runs-on: ubuntu-latest
    container: rocker/r-devel-san:latest
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=0
      _R_CHECK_FORCE_SUGGESTS_: 'false'
    steps:
      - uses: actions/checkout@v5

      # Everything builds from source here; fs (via testthat) needs libuv headers.
      # install.packages() only warns on failure, so verify the packages loaded.
      - name: Install dependencies
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends libuv1-dev
          RDscript -e 'pkgs <- c("Rcpp", "testthat"); install.packages(pkgs, repos = "https://cloud.r-project.org"); for (p in pkgs) if (!requireNamespace(p, quietly = TRUE)) stop("failed to install ", p)'

      - name: Build and check
        run: |
          RD CMD build .
          RD CMD check --no-manual AhoCorasickTrie_*.tar.gz

      - name: Fail on sanitizer reports
        if: always()
        run: |
          if grep -rnE "runtime error|ERROR: AddressSanitizer" AhoCorasickTrie.Rcheck/; then
            echo "::error::Sanitizer reported errors (see above)"
            exit 1
          fi

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-check-results
          path: AhoCorasickTrie.Rcheck
